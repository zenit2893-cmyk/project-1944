# Read-only extracted-data mapping for the CoD3 native port.
#
# This file is intentionally an isolated integration artifact. It is not
# included by the active cod3-pc executable until a caller explicitly wires
# the mapping into its VFS setup.

schema_version = 1
source_root = "../../game/cod3"
source_manifest = "../../analysis/disc-file-manifest.csv"
source_revision = "default.xex sha256 2944EEC7D1231AD6798B5F9F8ADF8855F5E489296B22EAB45B27A577CEE23692"
read_only = true
allow_content_fallback = false
alias_policy = "game-and-partition-only"

[mount]
physical_path = "\\Device\\Harddisk0\\Partition1"
game_alias = "game:"
partition_alias = "d:"

# Xenia-style extracted-XEX convention: mount the directory containing the
# XEX, then resolve GAME:\foo and D:\foo to the same host root. Case and
# slash differences are normalized before lookup.
[[root_mapping]]
guest = "game:/"
host = "."

[[root_mapping]]
guest = "d:/"
host = "."

[[root_mapping]]
guest = "\\Device\\Harddisk0\\Partition1\\"
host = "."

# Exact content roots observed in the 553-file extraction. The lists of
# selected files live in cod3_vfs_media_map.cpp and are checked by the native
# test; no asset bytes are copied into this integration directory.
[[content_root]]
guest = "d:/config"
host = "config"
kind = "configuration"

[[content_root]]
guest = "d:/media"
host = "media"
kind = "font"

[[content_root]]
guest = "d:/movies"
host = "movies"
kind = "video-and-audio"

[[content_root]]
guest = "d:/sp"
host = "sp"
kind = "single-player"

[[content_root]]
guest = "d:/mp"
host = "mp"
kind = "multiplayer"

[inventory]
expected_files = 553
expected_directories = 41
expected_total_bytes = 6193138297

# The resolver does not apply these observations. A caller may only enable a
# content alias after independently proving the title's language semantics.
[[content_alias]]
requested = "d:/movies/legal-us-en.wma"
candidate = "d:/movies/legal-us.wma"
enabled = false
reason = "Candidate exists, but no title-level equivalence has been verified."

[[content_alias]]
requested = "d:/movies/legal-us-fr.wma"
candidate = ""
enabled = false
reason = "No French source file is present."

[[content_alias]]
requested = "d:/movies/legal-us-de.wma"
candidate = ""
enabled = false
reason = "No German source file is present."

