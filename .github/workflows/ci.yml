name: Source checks

on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check repository content
        shell: pwsh
        run: ./scripts/repo/Test-RepoContent.ps1 -StrictPersonalPaths
      - name: Parse PowerShell and check launcher translations in PowerShell 7
        shell: pwsh
        run: ./scripts/repo/Test-Source.ps1
      - name: Parse PowerShell and check launcher translations in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/repo/Test-Source.ps1
